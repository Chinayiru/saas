# docker-compose.yml — 一键启动全部服务
# 使用：docker-compose up -d
# 停止：docker-compose down

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Cxt517852504
      MYSQL_DATABASE: saas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  java-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_HOST=python-service
      - AI_SERVICE_PORT=8000
    depends_on:
      - mysql
      - redis

  python-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=sk-ws-H.PEEHLDI.ItuH.MEQCIQD-GvIojAbDEWPsFmgzZNKSU5z6PkUH_qPggwgkYLlxAQIfKskJo_rOsgj0XgrbdYK6oaX3ERHSv_Dd3XgcjCG8CA
      - CHAT_MODEL=qwen-plus
      - EMBED_MODEL=text-embedding-v3
    depends_on:
      - mysql

volumes:
  mysql_data:
